version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    volumes:
      - ./:/var/www/html
    environment:
      # Make sure these match your .env
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - mysql
    networks:
      - laravel

  web:
    image: nginx:stable
    container_name: laravel_web
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3303:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laravel

  node:
    image: node:current
    container_name: laravel_node
    working_dir: /var/www/html
    command: bash -lc "npm i && npm run dev"
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"   # Vite default port
    environment:
      # Ensure Vite is reachable from outside container
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173
      CHOKIDAR_USEPOLLING: "true"   # helps file watching in Docker on some OS
    depends_on:
      - app
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge
